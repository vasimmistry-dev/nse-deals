[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-deals"
version = "0.1.0"
description = "Fetch, parse and analyse NSE India bulk deals, block deals and short-selling data."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vasim Mistry" }]
keywords = ["nse", "india", "stock-market", "bulk-deals", "block-deals", "short-selling", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/vasimmistry-dev/nse-deals"
Issues = "https://github.com/vasimmistry-dev/nse-deals/issues"
"Powers" = "https://tickerkhoj.com"

[project.scripts]
nse-deals = "nse_deals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
